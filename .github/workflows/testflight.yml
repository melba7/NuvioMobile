# Builds Nuvio (upstream release in fork/UPSTREAM_TAG + the patches in fork/) on a GitHub Mac
# and uploads it to TestFlight. Runs after every change under fork/, after the nightly upstream
# check moves to a new release, and by hand from the Actions tab. Setup: FORK.md.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Runner (xlarge is faster but is a paid larger runner)
        type: choice
        options: [xcode-27, xcode-27-xlarge]
        default: xcode-27
  push:
    branches: [cmp-rewrite]
    paths:
      - "fork/**"
      - ".github/workflows/testflight.yml"

permissions:
  contents: read

concurrency:
  group: testflight
  # Never cancel a run halfway: it may hold a temporary signing certificate.
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload
    # Nuvio needs the iOS 27 SDK (iPhone Duo APIs); GitHub's xcode-27 image is the one that has it.
    runs-on: ${{ inputs.macos || 'xcode-27' }}
    timeout-minutes: 240
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      NUVIO_SIGNING: ${{ secrets.NUVIO_SIGNING }}
      GRADLE_OPTS: -Dfile.encoding=UTF-8
    steps:
      - name: Check the secrets
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=TestFlight is not set up yet::Missing repository secrets: ${missing[*]}. See FORK.md."
            exit 1
          fi
          if [ -z "$NUVIO_SIGNING" ]; then
            echo "::notice title=No stored certificate::NUVIO_SIGNING is not set, so this build makes a temporary distribution certificate and revokes it at the end. See FORK.md."
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: fork

      # Xcode 27.1 is what Nuvio's own builds use; fall back to the newest installed one.
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            xcode=/Applications/Xcode_27.1.app
          else
            xcode=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi beta | sort -V | tail -n 1)
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fork/UPSTREAM_TAG') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Write the App Store Connect settings
        working-directory: fork
        run: |
          mkdir -p state && chmod 700 state
          umask 077
          python3 - <<'PY'
          import json, os
          kid = os.environ["ASC_KEY_ID"].strip().strip("\"'").strip()
          path = os.path.abspath("state/AuthKey_%s.p8" % "".join(c for c in kid if c.isalnum()))
          with open(path, "w") as f:
              f.write(os.environ["ASC_KEY_P8"].strip() + "\n")
          json.dump({"key_id": kid, "issuer_id": os.environ["ASC_ISSUER_ID"].strip().strip("\"'").strip().lower(), "p8_path": path},
                    open("state/config.json", "w"), indent=2)
          PY
          if [ -n "$NUVIO_SIGNING" ]; then
            printf '%s' "$NUVIO_SIGNING" | base64 --decode | tar -xz -C state
            ls state/dist.json state/dist.key state/dist.cer >/dev/null
          else
            echo "NUVIO_EPHEMERAL_CERT=1" >> "$GITHUB_ENV"
          fi

      # Ask Apple about the key first. If it is refused, the app is still built, so the run shows
      # whether the code compiles, but nothing is uploaded and the run ends as failed.
      - name: Check the App Store Connect key
        working-directory: fork
        run: |
          if ! python3 preflight.py < /dev/null; then
            echo "NUVIO_BUILD_ONLY=1" >> "$GITHUB_ENV"
            echo "::warning title=Building without uploading::The App Store Connect secrets were refused (see the errors above). The app will be built to check that it compiles, but not uploaded."
          fi

      - name: Build, sign and upload
        working-directory: fork
        run: |
          python3 build_from_source.py < /dev/null 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}

      - name: Summary
        if: always()
        working-directory: fork
        run: |
          {
            echo "## Nuvio $(cat UPSTREAM_TAG)"
            echo '```'
            tail -n 25 build-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            fork/state/build.log
            fork/state/last-run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove secrets from the runner
        if: always()
        run: rm -rf fork/state
