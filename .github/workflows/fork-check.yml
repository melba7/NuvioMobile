# On every pull request: the fork patches still apply to upstream and the fast unit tests pass.
# Runs fork/check.sh (no Mac needed).
name: Fork check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Fork check
        run: fork/check.sh
