# Every night: if Nuvio has published a newer iOS release and our patches still apply to it,
# move fork/UPSTREAM_TAG to it and start the TestFlight build. If they no longer apply, open an
# issue saying why (once per release). Setup: FORK.md.
name: Upstream check

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to try (empty = newest iOS release)
        required: false
        default: ""

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Look for a newer Nuvio release
        id: up
        working-directory: fork
        env:
          NUVIO_ALLOW_NON_MAC: "1"
        run: python3 check_upstream.py "${{ inputs.tag }}"

      - name: Move to the new release and build it
        if: steps.up.outputs.newer == 'true' && steps.up.outputs.applies == 'true'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          printf '%s\n' "$TAG" > fork/UPSTREAM_TAG
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Build Nuvio $TAG"
          git push
          # A push made with the workflow token does not start other workflows, so start it here.
          gh workflow run testflight.yml --ref "${GITHUB_REF_NAME}"
          echo "Moved to Nuvio $TAG and started the TestFlight build." >> "$GITHUB_STEP_SUMMARY"

      - name: Report that the patches need updating
        if: steps.up.outputs.newer == 'true' && steps.up.outputs.applies != 'true'
        env:
          TAG: ${{ steps.up.outputs.tag }}
          LOG: ${{ steps.up.outputs.log }}
        run: |
          title="Nuvio $TAG: patches need updating"
          if gh issue list 2>/dev/null --state all --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Already reported: $title"
            exit 0
          fi
          body=$(printf 'Nuvio %s is out, but the fork still builds %s because:\n\n```\n%s\n```\n\nUpdate the patch in `fork/` (or ask Claude to), then push; the TestFlight build starts by itself.\n' "$TAG" "$(cat fork/UPSTREAM_TAG)" "$LOG")
          gh issue create --title "$title" --body "$body" || {
            echo "::error title=$title::$LOG"
            exit 1
          }
